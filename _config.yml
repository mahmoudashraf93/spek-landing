    output: true
    permalink: /:path/
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
  - docs
  - node_modules
  - package.json
  - package-lock.json
  - design-qa.md
  - cloudflare
  - wrangler.jsonc
  - .cloudflare
  - .wrangler
