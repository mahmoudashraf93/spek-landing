title: Spek — Voice, Text & Photo Translator
description: Translate everyday conversations in the dialect you need. Voice, text, and photo translation with country-specific language choices for family, travel, and life abroad.
url: https://usespek.com
baseurl: ""
appstore_link: https://apps.apple.com/app/id6748774580
author: Mahmoud Ashraf
timezone: Africa/Cairo
future: false
show_drafts: false
