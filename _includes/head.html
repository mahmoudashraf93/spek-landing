<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} — Spek{% else %}{{ site.title | escape }}{% endif %}</title>
  {% assign description = page.description | default: site.description %}
  {% assign social_image = page.image | default: '/assets/spek/social.jpg' %}
  <meta name="description" content="{{ description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="{% if page.layout == 'article' %}article{% else %}website{% endif %}">
  <meta property="og:title" content="{% if page.title %}{{ page.title | escape }} — Spek{% else %}{{ site.title | escape }}{% endif %}">
  <meta property="og:description" content="{{ description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ social_image | absolute_url }}">
  <meta property="og:image:alt" content="{{ page.image_alt | default: 'Spek — translate everyday conversations in the dialect you need' | escape }}">
  {% if page.layout == 'article' %}
  <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
  <meta property="article:modified_time" content="{{ page.updated | default: page.date | date_to_xmlschema }}">
  {% endif %}
  <meta name="twitter:card" content="summary_large_image">
  <meta name="apple-itunes-app" content="app-id=6748774580">
  <meta name="theme-color" content="#141411">
  <link rel="icon" type="image/png" href="{{ '/assets/spek/icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/spek/site.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  {% if page.translator %}<link rel="stylesheet" href="{{ '/assets/translator/translator.css' | relative_url }}?v={{ site.time | date: '%s' }}">{% endif %}
  <link rel="alternate" type="application/rss+xml" title="Spek guides" href="{{ '/feed.xml' | absolute_url }}">
  {% if page.blog %}<link rel="stylesheet" href="{{ '/assets/blog/blog.css' | relative_url }}">{% endif %}
</head>
