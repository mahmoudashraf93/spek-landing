<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} — Spek{% else %}{{ site.title | escape }}{% endif %}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{% if page.title %}{{ page.title | escape }} — Spek{% else %}{{ site.title | escape }}{% endif %}">
  <meta property="og:description" content="{{ site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/spek/social.jpg' | absolute_url }}">
  <meta property="og:image:alt" content="Spek — translate everyday conversations in the dialect you need">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="apple-itunes-app" content="app-id=6748774580">
  <meta name="theme-color" content="#141411">
  <link rel="icon" type="image/png" href="{{ '/assets/spek/icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/spek/site.css' | relative_url }}">
</head>
